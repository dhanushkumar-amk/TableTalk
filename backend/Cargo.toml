[package]
name = "tabletalk-backend"
version = "0.1.0"
edition = "2021"
default-run = "mcp_tabletalk_backend"

[[bin]]
name = "mcp_tabletalk_backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit", "catch-panic"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
rand = "0.8"
dotenvy = "0.15"
aws-config = { version = "1.5", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "1.60", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-types = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
